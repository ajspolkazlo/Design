# Konfiguracja Dev Scout — wykrywacz małych deweloperów w promieniu 20-30 km od Warszawy
#
# UWAGA: to jest punkt startowy. Dokładne nazwy gmin/powiatów i słowa kluczowe
# trzeba zweryfikować po pierwszym realnym imporcie danych z RWDZ (patrz CLAUDE.md, krok 1).

region:
  wojewodztwo: "mazowieckie"
  # Gminy w promieniu ok. 20-30 km od Warszawy (do doprecyzowania po pierwszym imporcie —
  # w RWDZ gmina bywa zapisana jako "gmina Piaseczno", "m. Piaseczno", "Piaseczno" itp.)
  gminy:
    - Piaseczno
    - Konstancin-Jeziorna
    - Lesznowola
    - Prazmow
    - Gora Kalwaria
    - Nadarzyn
    - Raszyn
    - Michalowice
    - Brwinow
    - Pruszkow
    - Ozarow Mazowiecki
    - Lomianki
    - Izabelin
    - Stare Babice
    - Lomianki
    - Legionowo
    - Jablonna
    - Nieporet
    - Wolomin
    - Marki
    - Zabki
    - Zielonka
    - Kobylka
    - Radzymin
    - Jozefow
    - Otwock
    - Wiazowna
    - Karczew
    - Celestynow
    - Grodzisk Mazowiecki
    - Milanowek
    - Podkowa Lesna

  # gminy do wykluczenia mimo pasującej nazwy powiatu (np. sama Warszawa)
  wyklucz:
    - Warszawa

building_types:
  # słowa kluczowe wyszukiwane w kolumnie z opisem zamierzenia (nazwa_zam_budowlanego),
  # case-insensitive, bez ogonków.
  #
  # Zweryfikowane na realnym pliku wynik_mazowieckie.csv (680k wierszy): rzeczywiste
  # opisy są bardzo zmienne w formie ("trzy budynki mieszkalne jednorodzinne w zabudowie
  # szeregowej", "budowa dwóch budynków ... w zabudowie bliźniaczej" itp.) — pełne frazy
  # z pierwotnej wersji configu łapały tylko 129/8697 (szeregowa) i 229/14963 (bliźniacza)
  # realnych trafień. Krótsze frazy poniżej łapią całość.
  include_keywords:
    - "w zabudowie szeregowej"
    - "w zabudowie bliźniaczej"
    - "w zabudowie wolnostojącej"
    - "jednorodzinnego wolnostojącego"
    - "jednorodzinnych wolnostojących"
    - "wolnostojący"          # łapie pojedyncze domy wolnostojące (na życzenie Adama)
    - "wielorodzinn"          # łapie wielorodzinny/wielorodzinne/wielorodzinnych
    - "zespol budynkow mieszkalnych jednorodzinnych"

  # Słowa kluczowe WYKLUCZAJĄCE — jeśli opis je zawiera, rekord odpada, nawet gdy
  # pasuje do include_keywords. Bez tego do wyników trafiały "kwiatki" typu:
  #   "Budowa ośmiu instalacji gazowych ... czterech budynków ... w zabudowie szeregowej"
  #   "budowa sieci wodociągowej i kanalizacji sanitarnej dla trzech budynków ... wielorodzinnych"
  # czyli pozwolenia na INSTALACJE i SIECI przy budynkach, a nie na same budynki.
  # (zweryfikowane na żywo — te trzy pierwsze wpisy usuwają ~10.5k śmieci z 41k trafień)
  exclude_keywords:
    - "instalacj"        # instalacje gazowe / elektryczne / wod-kan wewnętrzne
    - "sieci"            # sieci wodociągowe / kanalizacyjne / gazowe / elektroenergetyczne
    - "siec "
    - "kanalizacj"
    - "wodociag"
    - "przylacz"         # przyłącza
    - "zjazd"            # zjazd z drogi
    - "ogrodzenie"
    - "wiata"
    - "maszt"
    - "stacja"           # stacja transformatorowa / bazowa
    - "parking"
    - "oczyszczalni"     # przydomowa oczyszczalnia jako główny przedmiot
    - "zbiornik"         # zbiornik / szambo jako główny przedmiot
    - "studni"
    - "slup"
    - "napowietrzn"      # linia napowietrzna
    - "telekomunik"

  # Wymagaj, żeby "rodzaj zamierzenia" (kolumna nazwa_zamierzenia_bud) był budową
  # NOWEGO obiektu — odcina rozbiórki, rozbudowy, nadbudowy, odbudowy i "wykonanie
  # robót budowlanych innych" (to ostatnie łapało większość instalacji). Realny
  # rejestr ma dokładnie wartość "budowa nowego/nowych obiektów budowlanych".
  require_new_construction: true
  new_construction_hint: "budowa nowego"

# Filtr daty — bierzemy tylko wnioski złożone od tej daty (kolumna data_wplywu_wniosku).
# Na życzenie Adama zawężone do wniosków od 2024 — starsze zgłoszenia to nieaktualne
# leady (inwestycja dawno sprzedana albo porzucona).
date_filter:
  min_data: "2024-01-01"

investor_filter:
  # odrzucamy zgłoszenia gdzie inwestor to wyraźnie osoba fizyczna (imię nazwisko, brak formy prawnej)
  # i zostawiamy tylko wpisy, które wyglądają na firmę (patrz src/filters.py: looks_like_company)
  company_signals:
    - "sp. z o.o."
    - "sp.k."
    - "s.a."
    - "spolka"
    - "grupa"
    - "invest"
    - "development"
    - "deweloper"
    - "budownictwo"
    - "nieruchomosci"

known_large_developers:
  # znani, duzi deweloperzy z pelnym budzetem marketingowym — odrzucamy od razu,
  # zeby nie zasmiecac wynikow oczywistosciami
  - "Dom Development"
  - "Atal"
  - "Murapol"
  - "Ronson"
  - "Robyg"
  - "Echo Investment"
  - "Archicom"
  - "Nexity"
  - "Bouygues Immobilier"
  - "J.W. Construction"
  - "Marvipol"
  - "Unidevelopment"
  - "Develia"
  - "Victoria Dom"

scale_filter:
  # Liczba budynków jest teraz WYCIĄGANA z tekstu opisu (filters.extract_building_count):
  # z liczebników ("dwóch/trzech/czterech budynków") i cyfr ("budowa 4 budynków ...").
  # Realny eksport RWDZ nie ma osobnej kolumny z liczbą budynków, więc to jedyne źródło.
  min_budynkow: 1   # UWAGA: 1 = wpuszczamy pojedyncze domy wolnostojące (na życzenie Adama).
                    #        Ustaw 2, żeby odciąć domy "buduję dla siebie" i zostawić tylko
                    #        realne inwestycje wielobudynkowe.
  max_budynkow: 40  # powyżej tego to raczej duży gracz z własnym działem marketingu — odcinamy
  # gdy liczby nie da się wyciągnąć z opisu, NIE odrzucamy (lepiej przepuścić niż zgubić leada)

portal_check:
  # Zweryfikowane na zywo (2026): tylko OLX jawnie zezwala w robots.txt na
  # automatyczne zapytania do swojego wyszukiwania (Allow: /api/v1/offers/).
  # Otodom blokuje na poziomie CDN/WAF, RynekPierwotny/Morizon/Domiporta maja
  # jawny zakaz w robots.txt, Gratka nie ma udokumentowanego API. Reszta
  # portali w src/portal_check.py zwraca wiec zawsze False (nieprzetestowane,
  # NIE "potwierdzone czyste") — nie dodawaj ich tutaj, dopoki ktos nie
  # zaimplementuje realnego sprawdzenia, bo inaczej scoring.brak_na_portalach
  # bedzie nagradzal leady, ktorych w ogole nie sprawdzilismy.
  portale:
    - olx
  recheck_after_days: 14  # co ile dni ponownie sprawdzac tego samego leada

scoring:
  # scoring 0-100 zamiast twardego filtra — sortujemy, nie odrzucamy agresywnie
  weights:
    brak_na_portalach: 40
    mala_firma_bez_www: 20
    swiezy_wpis: 15       # < 30 dni od daty zgloszenia/decyzji
    mala_skala: 15        # 2-10 budynkow = bardziej "boutique"
    bliska_odleglosc: 10  # blizej centrum Warszawy w ramach 20-30 km
  # punkt odniesienia do liczenia odleglosci — Plac Defilad, centrum Warszawy
  warszawa_centrum:
    lat: 52.2297
    lon: 21.0122
  max_distance_km: 30

paths:
  raw_dir: "data/raw"
  db_path: "data/dev_scout.sqlite3"
  output_dir: "output"

rwdz:
  # plik per-województwo jest dużo mniejszy niż plik "cały kraj" — to nasze główne źródło
  wojewodztwo_zip_url: "https://wyszukiwarka.gunb.gov.pl/pliki_pobranie/wynik_mazowieckie.zip"
  # Zweryfikowane na realnym pliku: separator to ';' (nie '#'), plik ma BOM na
  # początku, stąd 'utf-8-sig' zamiast 'utf-8' (żeby BOM nie trafił do nazwy
  # pierwszej kolumny).
  column_separator: ";"
  encoding: "utf-8-sig"
